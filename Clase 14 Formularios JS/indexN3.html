<!DOCTYPE html> 
<html lang="es"> 

<head> 
    <meta charset="UTF-8">
    <title>Este texto es el título del documento</title>    
    <style>
        *{
            font-family: Verdana, Geneva, Tahoma, sans-serif;

        }

    <script>
function verifica(){
        let nombre = document.getElementById("nombre").value;
        let apellido = document.getElementById("apellido");

let espanes = document.getElementsByName("serror");
for( let i=0; i<espanes.length; i++){
    espanes[i].style.color="black";
    espanes[i].innerHTML = "";
}


if(nombre == ""){
    let tx=document.getElementById("snombre");
    tx.style.color="red";
    tx.innerHTML="Complete el nombre";
    return false;
    }
   
if(apellido.value == ""){
    let p1=document.getElementById("sapellido");
    p1.style.color="red";
    p1.innerHTML="Complete el apellido";
    return false;
    }



        alert(nombre + " " + apellido.value);

          
//            document.F1.submit();
        }

    </script>
</head> 

<body>

<form name="F1" action="javascript:verifica()" method="post"> <!-- action espera una URL -->

   </p>
